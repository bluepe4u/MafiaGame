<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d18">
  <title>Шпион</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Ccircle cx='11' cy='18' r='4' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='21' cy='18' r='4' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M15 18h2M6 13l4-5h12l4 5' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/spyfall/spy.css">
</head>
<body class="spyfall" data-phase="home">
  <div class="backdrop" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grain"></div></div>

  <header class="topbar">
    <div class="brand-switch">
      <button id="brandBtn" class="brand" type="button" aria-haspopup="true">
        <svg class="brand-mark spy-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><circle cx="11" cy="18" r="4"/><circle cx="21" cy="18" r="4"/><path d="M15 18h2M6 13l4-5h12l4 5"/></svg>
        <span data-i18n="site.spyfall"></span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <nav id="siteMenu" class="site-menu hidden">
        <a href="/"><span class="site-ico"></span><span data-i18n="site.mafia"></span></a>
        <a href="/monopoly/"><span class="site-ico"></span><span data-i18n="site.monopoly"></span></a>
        <a href="/spyfall/" class="current"><span class="site-ico"></span><span data-i18n="site.spyfall"></span></a>
      </nav>
    </div>
    <button id="topRoom" class="room-pill hidden" type="button"><span data-i18n="ui.room"></span> <span id="topCode" class="code"></span></button>
    <div id="topRound" class="phase-chip"></div>
    <div class="spacer"></div>
    <button id="boardBtn" class="icon-btn hidden" type="button"><span class="trophy"></span></button>
    <button id="alertsBtn" class="icon-btn" type="button" aria-pressed="true"></button>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="leaveBtn" class="ghost small hidden" data-i18n="ui.leaveRoom"></button>
    <button id="profileBtn" class="profile-btn hidden" type="button"></button>
  </header>

  <div id="offline" class="offline-banner hidden" role="status"><span class="spinner"></span><span data-i18n="ui.reconnecting"></span></div>

  <main id="app">
    <!-- home -->
    <section id="home" class="screen hidden">
      <div class="hero">
        <p class="eyebrow" data-i18n="spy.eyebrow"></p>
        <h1><span data-i18n="spy.heroA"></span> <em data-i18n="spy.heroB"></em></h1>
        <p class="muted hero-sub" data-i18n="spy.tagline"></p>
      </div>
      <div id="bootLoader" class="boot-loader" role="status"><span class="spinner"></span></div>
      <form id="authCard" class="card home-card hidden" autocomplete="on">
        <div class="tabs auth-tabs" role="tablist">
          <button type="button" data-auth-mode="login" data-i18n="auth.login"></button>
          <button type="button" data-auth-mode="register" data-i18n="auth.register"></button>
        </div>
        <label class="field"><span data-i18n="auth.username"></span> <input id="authUser" name="username" maxlength="20" autocomplete="username" spellcheck="false"></label>
        <label class="field"><span data-i18n="auth.password"></span> <input id="authPass" name="password" type="password" autocomplete="current-password"></label>
        <label id="inviteField" class="field hidden"><span data-i18n="auth.invite"></span> <input id="authInvite" name="invite" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <button id="authSubmit" type="submit" class="primary big-btn"></button>
        <p class="muted small-text auth-hint" data-i18n="auth.hint"></p>
      </form>
      <div id="playCard" class="card home-card hidden">
        <button id="homeProfile" class="me-row" type="button"></button>
        <button id="createBtn" class="primary big-btn" data-i18n="spy.createRoom"></button>
        <button id="homeBoard" class="ghost home-board"><span class="trophy"></span> <span data-i18n="spy.board.title"></span></button>
        <div class="divider"><span data-i18n="ui.orJoin"></span></div>
        <div class="row join-row">
          <input id="joinCode" class="code-input" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters" spellcheck="false">
          <button id="joinBtn" data-i18n="ui.join"></button>
          <button id="watchBtn" class="ghost" data-i18n="ui.watch"></button>
        </div>
      </div>
    </section>

    <!-- lobby -->
    <section id="lobby" class="screen hidden">
      <button id="homeBtn" class="ghost small back-home" type="button" data-i18n="ui.toHome"></button>
      <div class="lobby-grid">
        <div class="lobby-col">
          <div class="card">
            <div class="card-head"><h2 data-i18n="ui.players"></h2><span id="lobbyCount" class="count-pill"></span></div>
            <ul id="lobbyPlayers" class="list mono-list"></ul>
            <div class="row lobby-me">
              <button id="readyBtn" class="ready-btn"></button>
              <button id="watchToggle" class="ghost small"></button>
              <span id="readyCount" class="count-pill"></span>
            </div>
            <div id="spectatorBox" class="spectator-box hidden">
              <h3 data-i18n="ui.spectators"></h3>
              <div id="spectatorList" class="spectator-list"></div>
            </div>
            <div class="invite">
              <img id="inviteQr" class="qr" alt="" width="104" height="104">
              <div class="invite-body">
                <p id="shareCode" class="share muted"></p>
                <p class="muted small-text" data-i18n="ui.scanToJoin"></p>
                <div class="row"><button id="copyLink" class="small" data-i18n="ui.copyLink"></button></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2 data-i18n="ui.gameSetup"></h2></div>
          <div id="hostSettings" class="hidden">
            <div class="grid2">
              <label class="field"><span data-i18n="spy.rounds"></span> <input type="number" min="1" max="10" id="roundsInput"></label>
              <label class="field"><span data-i18n="spy.minutes"></span> <input type="number" min="3" max="15" id="minutesInput"></label>
              <label class="field"><span data-i18n="spy.locationCount"></span> <input type="number" min="10" max="60" step="5" id="locationsInput"></label>
            </div>
            <div class="field packs-field"><span data-i18n="spy.packs"></span><div id="packList" class="pack-list"></div></div>
            <div class="checks settings-rest">
              <label class="field"><span data-i18n="spy.verdict"></span>
                <select id="verdictSelect"><option value="unanimous" data-i18n="spy.verdict.unanimous"></option><option value="majority" data-i18n="spy.verdict.majority"></option></select></label>
              <label class="check"><input type="checkbox" class="switch" id="voiceOn"> <span data-i18n="ui.voice"></span></label>
            </div>
          </div>
          <ul id="setupSummary" class="summary"></ul>
          <button id="startBtn" class="primary big-btn hidden" data-i18n="spy.start"></button>
          <p id="waitHost" class="wait muted hidden"><span class="dots"><i></i><i></i><i></i></span> <span data-i18n="ui.waitHost"></span></p>
        </div>
      </div>
    </section>

    <!-- game -->
    <section id="game" class="screen hidden">
      <div class="spy-layout">
        <aside class="spy-side">
          <div class="card spy-card-box">
            <h3 data-i18n="spy.yourCard"></h3>
            <div id="spyCard" class="spy-card" tabindex="0"></div>
          </div>
          <div class="card">
            <div class="card-head"><h3 data-i18n="spy.locations"></h3><span id="locCount" class="count-pill"></span></div>
            <p class="muted small-text" data-i18n="spy.crossOut"></p>
            <div id="locGrid" class="loc-grid"></div>
          </div>
        </aside>
        <div class="spy-main">
          <div id="stagePanel" class="card stage-panel"></div>
          <div class="card">
            <div class="card-head"><h3 data-i18n="spy.table"></h3><span id="roundInfo" class="count-pill"></span></div>
            <div id="spyPlayers" class="spy-players"></div>
          </div>
          <div id="historyBox" class="card hidden">
            <h3 data-i18n="spy.history"></h3>
            <ol id="historyList" class="spy-history"></ol>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- the spy names the location -->
  <div id="guessSheet" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head"><h2 data-i18n="spy.guessTitle"></h2><button id="guessClose" class="ghost small" data-i18n="ui.close"></button></div>
      <div class="sheet-body"><p class="muted small-text" data-i18n="spy.guessHint"></p><div id="guessGrid" class="loc-grid big"></div></div>
    </div>
  </div>

  <!-- leaderboard -->
  <div id="boardSheet" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet board-sheet">
      <div class="sheet-head"><h2><span class="trophy"></span> <span data-i18n="spy.board.title"></span></h2><button id="boardClose" class="ghost small" data-i18n="ui.close"></button></div>
      <div class="sheet-body">
        <div class="tabs board-tabs" role="tablist">
          <button data-board="wins" data-i18n="spy.board.tab.wins"></button>
          <button data-board="points" data-i18n="spy.board.tab.points"></button>
          <button data-board="spy" data-i18n="spy.board.tab.spy"></button>
          <button data-board="games" data-i18n="spy.board.tab.games"></button>
        </div>
        <ol id="boardList" class="board-list"></ol>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/voice.js"></script>
  <script src="/spyfall/spy.js"></script>
</body>
</html>
