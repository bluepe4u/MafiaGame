<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="A corner of the Tycoon board with houses, dice and money">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2f2510"/><stop offset=".6" stop-color="#17120a"/><stop offset="1" stop-color="#0c0906"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e1d3"/></linearGradient>
    <g id="house"><path d="M0 10 L9 2 L18 10 V20 H0 Z" fill="#16a34a"/><path d="M0 10 L9 2 L18 10" fill="none" stroke="#0d6b31" stroke-width="2"/></g>
    <g id="hotel"><path d="M0 12 L14 2 L28 12 V24 H0 Z" fill="#dc2626"/><rect x="5" y="14" width="5" height="5" fill="#fca5a5"/><rect x="18" y="14" width="5" height="5" fill="#fca5a5"/></g>
  </defs>
  <rect width="640" height="520" fill="url(#bg)"/>
  <!-- the board: one corner and two rows, in perspective -->
  <g transform="translate(320 300) rotate(-18) skewX(14)" filter="url(#sh)">
    <rect x="-250" y="-170" width="430" height="300" rx="14" fill="#efe7d2"/>
    <rect x="-250" y="-170" width="430" height="300" rx="14" fill="none" stroke="#1d2b22" stroke-width="3"/>
    <!-- the top row of streets -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d2b22" text-anchor="middle">
      <g transform="translate(-250 -170)">
        <rect width="86" height="86" fill="#efe7d2" stroke="#1d2b22" stroke-width="2"/>
        <text x="43" y="40" font-weight="800" font-size="14">GO</text><text x="43" y="58" font-size="10">+200</text><path d="M18 70 h50 l-8 -6 m8 6 l-8 6" fill="none" stroke="#dc2626" stroke-width="3"/>
      </g>
      <g transform="translate(-164 -170)"><rect width="58" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect width="58" height="20" fill="#e11d48" stroke="#1d2b22" stroke-width="2"/><text x="29" y="52">Arbat</text><text x="29" y="74" font-size="10">220</text></g>
      <g transform="translate(-106 -170)"><rect width="58" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect width="58" height="20" fill="#e11d48" stroke="#1d2b22" stroke-width="2"/><text x="29" y="52">Tverskaya</text><text x="29" y="74" font-size="10">240</text></g>
      <g transform="translate(-48 -170)"><rect width="58" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><text x="29" y="40" font-size="20">?</text><text x="29" y="66">Chance</text></g>
      <g transform="translate(10 -170)"><rect width="58" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect width="58" height="20" fill="#f59e0b" stroke="#1d2b22" stroke-width="2"/><text x="29" y="52">Nevsky</text><text x="29" y="74" font-size="10">260</text></g>
      <g transform="translate(68 -170)"><rect width="58" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect width="58" height="20" fill="#f59e0b" stroke="#1d2b22" stroke-width="2"/><text x="29" y="52">Sadovaya</text><text x="29" y="74" font-size="10">280</text></g>
      <g transform="translate(126 -170)"><rect width="54" height="86" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect width="54" height="20" fill="#2563eb" stroke="#1d2b22" stroke-width="2"/><text x="27" y="52">Pier</text><text x="27" y="74" font-size="10">350</text></g>
      <!-- the left column -->
      <g transform="translate(-250 -84)"><rect width="86" height="54" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect x="66" width="20" height="54" fill="#16a34a" stroke="#1d2b22" stroke-width="2"/><text x="33" y="32">Lenina</text></g>
      <g transform="translate(-250 -30)"><rect width="86" height="54" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect x="66" width="20" height="54" fill="#16a34a" stroke="#1d2b22" stroke-width="2"/><text x="33" y="32">Mira</text></g>
      <g transform="translate(-250 24)"><rect width="86" height="54" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><text x="43" y="24" font-size="18">⛁</text><text x="43" y="44">Tax</text></g>
      <g transform="translate(-250 78)"><rect width="86" height="52" fill="#f7f1e1" stroke="#1d2b22" stroke-width="2"/><rect x="66" width="20" height="52" fill="#7c3aed" stroke="#1d2b22" stroke-width="2"/><text x="33" y="30">Ring</text></g>
    </g>
    <!-- houses and a hotel on the streets -->
    <g transform="translate(-160 -200)"><use href="#house"/><use href="#house" x="21"/></g>
    <g transform="translate(-102 -200)"><use href="#house"/><use href="#house" x="21"/></g>
    <g transform="translate(24 -204)"><use href="#hotel"/></g>
    <!-- the middle of the board -->
    <text x="-30" y="40" font-family="Georgia, serif" font-style="italic" font-size="40" fill="#1d2b22" fill-opacity=".14">Tycoon</text>
  </g>
  <!-- money -->
  <g transform="translate(118 404) rotate(-10)" filter="url(#sh)">
    <rect width="132" height="62" rx="6" fill="#7fbf8a"/><rect x="6" y="6" width="120" height="50" rx="4" fill="none" stroke="#2f6b3a" stroke-width="2"/><text x="66" y="40" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#2f6b3a">500</text>
  </g>
  <g transform="translate(140 388) rotate(-2)" filter="url(#sh)">
    <rect width="132" height="62" rx="6" fill="#f0c674"/><rect x="6" y="6" width="120" height="50" rx="4" fill="none" stroke="#8a6416" stroke-width="2"/><text x="66" y="40" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#8a6416">100</text>
  </g>
  <!-- the dice -->
  <g transform="translate(452 352) rotate(12)" filter="url(#sh)">
    <rect width="72" height="72" rx="14" fill="url(#die)"/>
    <g fill="#1d1d24"><circle cx="18" cy="18" r="6"/><circle cx="54" cy="18" r="6"/><circle cx="36" cy="36" r="6"/><circle cx="18" cy="54" r="6"/><circle cx="54" cy="54" r="6"/></g>
  </g>
  <g transform="translate(540 392) rotate(-16)" filter="url(#sh)">
    <rect width="64" height="64" rx="13" fill="url(#die)"/>
    <g fill="#1d1d24"><circle cx="16" cy="16" r="5.5"/><circle cx="32" cy="32" r="5.5"/><circle cx="48" cy="48" r="5.5"/></g>
  </g>
  <!-- a deed card -->
  <g transform="translate(500 70) rotate(9)" filter="url(#sh)">
    <rect width="118" height="156" rx="8" fill="#fdfaf0"/><rect x="8" y="8" width="102" height="34" rx="4" fill="#f59e0b"/>
    <text x="59" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#3b2a06">TITLE DEED</text><text x="59" y="37" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#3b2a06">NEVSKY</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#3b3b44"><text x="14" y="62">Rent</text><text x="104" y="62" text-anchor="end">22</text><text x="14" y="80">1 house</text><text x="104" y="80" text-anchor="end">110</text><text x="14" y="98">2 houses</text><text x="104" y="98" text-anchor="end">330</text><text x="14" y="116">Hotel</text><text x="104" y="116" text-anchor="end">1 150</text></g>
  </g>
</svg>
