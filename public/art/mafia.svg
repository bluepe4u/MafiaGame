<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="A figure in a fedora under a street lamp at night, with a Mafia role card">
  <defs>
    <radialGradient id="sky" cx="72%" cy="18%" r="95%"><stop offset="0" stop-color="#2b2f6e"/><stop offset=".45" stop-color="#151838"/><stop offset="1" stop-color="#07081a"/></radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9e7ff" stop-opacity=".55"/><stop offset="1" stop-color="#e9e7ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb84d" stop-opacity=".06"/></linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffcf73" stop-opacity=".5"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient>
    <radialGradient id="bulb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d8"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".85"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/></radialGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121430"/><stop offset="1" stop-color="#06070f"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2318"/><stop offset=".35" stop-color="#14110c"/><stop offset="1" stop-color="#07060a"/></linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf5e6"/><stop offset="1" stop-color="#eadfc4"/></linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f86"/><stop offset="1" stop-color="#1d1650"/></linearGradient>
    <pattern id="backPattern" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="none"/><path d="M0 7h14" stroke="#5b4fc0" stroke-width="2" opacity=".55"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <mask id="crescent"><rect width="640" height="520" fill="#fff"/><circle cx="510" cy="90" r="42" fill="#000"/></mask>
    <clipPath id="frame"><rect width="640" height="520"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="520" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#dfe2ff">
      <circle cx="58" cy="44" r="1.6" opacity=".8"/><circle cx="120" cy="92" r="1.1" opacity=".6"/><circle cx="196" cy="38" r="1.4" opacity=".7"/>
      <circle cx="262" cy="80" r="1" opacity=".5"/><circle cx="330" cy="30" r="1.5" opacity=".8"/><circle cx="398" cy="70" r="1.1" opacity=".6"/>
      <circle cx="560" cy="160" r="1.2" opacity=".6"/><circle cx="604" cy="54" r="1.5" opacity=".7"/><circle cx="34" cy="150" r="1.1" opacity=".5"/>
      <circle cx="150" cy="160" r="1.3" opacity=".55"/><circle cx="430" cy="140" r="1" opacity=".5"/>
    </g>

    <!-- the moon -->
    <circle cx="488" cy="104" r="96" fill="url(#moonGlow)"/>
    <g mask="url(#crescent)">
      <circle cx="488" cy="104" r="46" fill="#ecebff"/>
      <circle cx="470" cy="122" r="5" fill="#d6d4f3"/><circle cx="458" cy="96" r="3" fill="#d6d4f3"/>
    </g>

    <!-- the skyline -->
    <g fill="#0d0f27">
      <rect x="-10" y="250" width="74" height="230"/>
      <rect x="58" y="210" width="58" height="270"/>
      <path d="M110 300h70v180h-70z"/>
      <rect x="174" y="236" width="52" height="244"/>
      <path d="M380 270h56v210h-56z"/>
      <path d="M430 222h40l6-18 6 18h24v258h-76z"/>
      <rect x="500" y="282" width="66" height="198"/>
      <rect x="560" y="244" width="90" height="236"/>
    </g>
    <g fill="#ffd27a">
      <rect x="10" y="270" width="9" height="12" opacity=".9"/><rect x="34" y="300" width="9" height="12" opacity=".55"/><rect x="10" y="330" width="9" height="12" opacity=".35"/>
      <rect x="72" y="232" width="9" height="12" opacity=".7"/><rect x="94" y="262" width="9" height="12"/><rect x="72" y="292" width="9" height="12" opacity=".45"/><rect x="94" y="352" width="9" height="12" opacity=".6"/>
      <rect x="124" y="320" width="9" height="12" opacity=".5"/><rect x="152" y="350" width="9" height="12" opacity=".8"/>
      <rect x="186" y="258" width="9" height="12" opacity=".6"/><rect x="206" y="318" width="9" height="12" opacity=".9"/>
      <rect x="392" y="292" width="9" height="12" opacity=".7"/><rect x="414" y="322" width="9" height="12" opacity=".4"/>
      <rect x="442" y="244" width="9" height="12"/><rect x="464" y="274" width="9" height="12" opacity=".5"/><rect x="442" y="334" width="9" height="12" opacity=".75"/><rect x="486" y="304" width="9" height="12" opacity=".6"/>
      <rect x="512" y="304" width="9" height="12" opacity=".5"/><rect x="540" y="334" width="9" height="12" opacity=".85"/>
      <rect x="576" y="264" width="9" height="12" opacity=".7"/><rect x="604" y="294" width="9" height="12"/><rect x="576" y="354" width="9" height="12" opacity=".4"/>
    </g>

    <!-- wet street -->
    <rect y="430" width="640" height="90" fill="url(#street)"/>
    <path d="M0 430h640" stroke="#2a2d5c" stroke-width="2"/>

    <!-- the street lamp and its light -->
    <path d="M232 132 L118 440 H350 Z" fill="url(#cone)"/>
    <ellipse cx="236" cy="446" rx="150" ry="20" fill="url(#pool)"/>
    <rect x="229" y="132" width="7" height="312" fill="#1b1d33"/>
    <rect x="212" y="438" width="40" height="8" rx="3" fill="#1b1d33"/>
    <g transform="translate(232 132)">
      <circle r="44" fill="url(#bulb)"/>
      <path d="M-20 -6 h40 l-8 -14 h-24 z" fill="#232640"/>
      <ellipse cy="-2" rx="11" ry="5" fill="#fff4cf"/>
    </g>

    <!-- the figure in the fedora, half in the light -->
    <g transform="translate(300 0)" filter="url(#sh)">
      <!-- legs and shoes -->
      <path d="M-22 392 l-4 46 h16 l4 -46 z M8 392 l2 46 h16 l-2 -46 z" fill="#0a0910"/>
      <path d="M-30 436 h26 v7 h-30 z M8 436 h26 l4 7 h-30 z" fill="#050408"/>
      <!-- the coat -->
      <path d="M-34 262 Q-50 268 -54 300 L-62 404 Q-30 414 0 410 Q30 414 60 404 L52 300 Q48 268 32 262 Q0 252 -34 262 z" fill="url(#coat)"/>
      <path d="M-2 266 L-14 410 M-2 266 L10 300" stroke="#3b3122" stroke-width="2" fill="none" opacity=".8"/>
      <!-- the collar turned up -->
      <path d="M-30 262 L-14 236 L-2 268 Z M28 262 L12 236 L-2 268 Z" fill="#1c1810"/>
      <!-- the light catches the lamp side -->
      <path d="M-54 300 Q-50 268 -34 262" fill="none" stroke="#c99a4a" stroke-width="2.5" opacity=".7"/>
      <path d="M-58 360 L-62 404" stroke="#c99a4a" stroke-width="2" opacity=".45"/>
      <!-- face in shadow -->
      <path d="M-12 210 q12 -6 24 0 v26 q-12 10 -24 0 z" fill="#2a1f19"/>
      <path d="M-12 222 q12 4 24 0" stroke="#000" stroke-width="5" opacity=".55"/>
      <!-- the fedora -->
      <ellipse cx="0" cy="210" rx="44" ry="9" fill="#0e0d12"/>
      <path d="M-26 208 Q-26 180 -12 174 Q0 182 12 174 Q26 180 26 208 Z" fill="#17151d"/>
      <path d="M-26 202 Q0 208 26 202 L26 208 Q0 214 -26 208 Z" fill="#7a1420"/>
      <path d="M-44 210 Q-38 205 -26 206" stroke="#c99a4a" stroke-width="2" fill="none" opacity=".6"/>
      <!-- a curl of smoke from the cigarette -->
      <circle cx="16" cy="232" r="2" fill="#ff7a3d"/>
      <path d="M18 228 q8 -10 0 -18 q-8 -10 4 -22 q8 -8 2 -18" fill="none" stroke="#c9c7e6" stroke-width="2" opacity=".35" stroke-linecap="round"/>
    </g>
    <!-- his long shadow on the street -->
    <path d="M300 444 L470 470 L478 462 L320 438 Z" fill="#000" opacity=".35" filter="url(#soft)"/>

    <!-- the role cards: one face down, the Mafia face up -->
    <g transform="translate(506 372) rotate(12)" filter="url(#sh)">
      <rect x="-62" y="-88" width="124" height="176" rx="12" fill="url(#cardBack)" stroke="#120d36" stroke-width="2"/>
      <rect x="-52" y="-78" width="104" height="156" rx="8" fill="url(#backPattern)" stroke="#6d62d6" stroke-width="1.5" opacity=".9"/>
      <circle r="18" fill="#2a2170" stroke="#8b80ec" stroke-width="2"/>
      <text y="7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#c9c3ff">?</text>
    </g>
    <g transform="translate(452 388) rotate(-9)" filter="url(#sh)">
      <rect x="-62" y="-88" width="124" height="176" rx="12" fill="url(#cardFace)" stroke="#3b2a14" stroke-width="2"/>
      <rect x="-62" y="-88" width="124" height="38" rx="12" fill="#b91c2c"/>
      <rect x="-62" y="-62" width="124" height="12" fill="#b91c2c"/>
      <text y="-62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" letter-spacing="3" fill="#fff4e6">MAFIA</text>
      <!-- the card's own fedora -->
      <g transform="translate(0 8)">
        <ellipse cx="0" cy="14" rx="40" ry="9" fill="#17151d"/>
        <path d="M-24 12 Q-24 -16 -10 -22 Q0 -14 10 -22 Q24 -16 24 12 Z" fill="#26222e"/>
        <path d="M-24 4 Q0 10 24 4 L24 12 Q0 18 -24 12 Z" fill="#b91c2c"/>
      </g>
      <path d="M-40 52 h80" stroke="#3b2a14" stroke-width="1.5" opacity=".35"/>
      <circle cx="-16" cy="66" r="3.5" fill="#b91c2c"/><circle cx="0" cy="66" r="3.5" fill="#b91c2c"/><circle cx="16" cy="66" r="3.5" fill="#b91c2c" opacity=".35"/>
    </g>

    <!-- the night's tally in the corner -->
    <g transform="translate(40 40)">
      <rect width="120" height="34" rx="17" fill="#2b2f6e" fill-opacity=".75" stroke="#6d73d6" stroke-opacity=".6"/>
      <circle cx="20" cy="17" r="7" fill="#ecebff"/><circle cx="23.5" cy="14.5" r="6.4" fill="#2b2f6e"/>
      <text x="38" y="22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#dfe0ff">NIGHT 3</text>
    </g>
  </g>
</svg>
