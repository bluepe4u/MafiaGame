<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>Kingdoms — city-building card game with secret roles · Королевства</title>
  <meta name="description" content="Pick a secret character every round, build districts and outwit your friends. 3–8 players in the browser, free, no download.">
  <link rel="canonical" href="https://bluepeau.club/kingdoms/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="bluepeau.club">
  <meta property="og:title" content="Kingdoms — city-building card game with secret roles · Королевства">
  <meta property="og:description" content="Pick a secret character every round, build districts and outwit your friends. 3–8 players in the browser, free, no download.">
  <meta property="og:url" content="https://bluepeau.club/kingdoms/">
  <meta property="og:image" content="https://bluepeau.club/og/kingdoms.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23d4a24c'/%3E%3Cpath d='M7 25V13l3 2V9l3 2V6l3-2 3 2v5l3-2v6l3-2v12z' fill='%23111827'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/kingdoms/cit.css">
</head>
<body class="cit" data-phase="home">
  <div class="backdrop" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grain"></div></div>

  <header class="topbar">
    <div class="brand-switch">
      <button id="brandBtn" class="brand" type="button" aria-haspopup="true">
        <svg class="brand-mark cit-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M7 25V13l3 2V9l3 2V6l3-2 3 2v5l3-2v6l3-2v12z"/></svg>
        <span data-i18n="site.citadels"></span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <nav id="siteMenu" class="site-menu hidden">
        <a href="/"><span class="site-ico"></span><span data-i18n="site.mafia"></span></a>
        <a href="/tycoon/"><span class="site-ico"></span><span data-i18n="site.monopoly"></span></a>
        <a href="/spy/"><span class="site-ico"></span><span data-i18n="site.spyfall"></span></a>
        <a href="/kingdoms/" class="current"><span class="site-ico"></span><span data-i18n="site.citadels"></span></a>
        <a href="/poker/"><span class="site-ico"></span><span data-i18n="site.poker"></span></a>
      </nav>
    </div>
    <button id="topRoom" class="room-pill hidden" type="button"><span data-i18n="ui.room"></span> <span id="topCode" class="code"></span></button>
    <div id="topRound" class="phase-chip"></div>
    <div class="spacer"></div>
    <button id="rulesBtn" class="icon-btn" type="button"></button>
    <button id="boardBtn" class="icon-btn hidden" type="button"><span class="trophy"></span></button>
    <button id="alertsBtn" class="icon-btn" type="button" aria-pressed="true"></button>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="leaveBtn" class="ghost small hidden" data-i18n="ui.leaveRoom"></button>
    <button id="profileBtn" class="profile-btn hidden" type="button"></button>
  </header>

  <div id="offline" class="offline-banner hidden" role="status"><span class="spinner"></span><span data-i18n="ui.reconnecting"></span></div>

  <main id="app">
    <!-- home -->
    <section id="home" class="screen hidden">
      <div class="hero">
        <p class="eyebrow" data-i18n="cit.eyebrow"></p>
        <h1><span data-i18n="cit.heroA"></span> <em data-i18n="cit.heroB"></em></h1>
        <p class="muted hero-sub" data-i18n="cit.tagline"></p>
      </div>
      <div id="bootLoader" class="boot-loader" role="status"><span class="spinner"></span></div>
      <form id="authCard" class="card home-card hidden" autocomplete="on">
        <div class="tabs auth-tabs" role="tablist">
          <button type="button" data-auth-mode="login" data-i18n="auth.login"></button>
          <button type="button" data-auth-mode="register" data-i18n="auth.register"></button>
        </div>
        <label class="field"><span data-i18n="auth.username"></span> <input id="authUser" name="username" maxlength="20" autocomplete="username" spellcheck="false"></label>
        <label class="field"><span data-i18n="auth.password"></span> <input id="authPass" name="password" type="password" autocomplete="current-password"></label>
        <label id="inviteField" class="field hidden"><span data-i18n="auth.invite"></span> <input id="authInvite" name="invite" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <button id="authSubmit" type="submit" class="primary big-btn"></button>
        <p class="muted small-text auth-hint" data-i18n="auth.hint"></p>
      </form>
      <div id="playCard" class="card home-card hidden">
        <button id="homeProfile" class="me-row" type="button"></button>
        <button id="createBtn" class="primary big-btn" data-i18n="cit.createRoom"></button>
        <div class="row home-links">
          <button id="homeBoard" class="ghost"><span class="trophy"></span> <span data-i18n="board.title"></span></button>
          <button id="homeRules" class="ghost" data-i18n="rules.title"></button>
        </div>
        <div class="divider"><span data-i18n="ui.orJoin"></span></div>
        <div class="row join-row">
          <input id="joinCode" class="code-input" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters" spellcheck="false">
          <button id="joinBtn" data-i18n="ui.join"></button>
          <button id="watchBtn" class="ghost" data-i18n="ui.watch"></button>
        </div>
      </div>
    </section>

    <!-- lobby -->
    <section id="lobby" class="screen hidden">
      <button id="homeBtn" class="ghost small back-home" type="button" data-i18n="ui.toHome"></button>
      <div class="lobby-grid">
        <div class="lobby-col">
          <div class="card">
            <div class="card-head"><h2 data-i18n="cit.players"></h2><span id="lobbyCount" class="count-pill"></span></div>
            <ul id="lobbyPlayers" class="list"></ul>
            <div class="row lobby-me">
              <button id="readyBtn" class="ready-btn"></button>
              <button id="watchToggle" class="ghost small"></button>
              <span id="readyCount" class="count-pill"></span>
            </div>
            <div id="spectatorBox" class="spectator-box hidden">
              <h3 data-i18n="ui.spectators"></h3>
              <div id="spectatorList" class="spectator-list"></div>
            </div>
            <div class="invite">
              <img id="inviteQr" class="qr" alt="" width="104" height="104">
              <div class="invite-body">
                <p id="shareCode" class="share muted"></p>
                <p class="muted small-text" data-i18n="ui.scanToJoin"></p>
                <div class="row"><button id="copyLink" class="small" data-i18n="ui.copyLink"></button></div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2 data-i18n="cit.setup"></h2><button id="resetRules" class="ghost small hidden" data-i18n="cit.set.reset"></button></div>
          <div id="settingsBox" class="settings-box"></div>
          <button id="startBtn" class="primary big-btn hidden" data-i18n="cit.start"></button>
          <p id="waitHost" class="wait muted hidden"><span class="dots"><i></i><i></i><i></i></span> <span data-i18n="ui.waitHost"></span></p>
        </div>
      </div>
    </section>

    <!-- game -->
    <section id="game" class="screen hidden">
      <div class="cit-layout">
        <div class="cit-main">
          <div id="charTrack" class="char-track"></div>
          <div id="opponents" class="opponents"></div>
          <div id="myBoard" class="card my-board"></div>
        </div>
        <aside class="cit-side">
          <div id="actionPanel" class="card action-panel"></div>
          <div class="card log-card">
            <h3 data-i18n="cit.log.title"></h3>
            <ul id="log" class="log"></ul>
          </div>
          <div id="reactBar" class="react-bar cit-react hidden"></div>
          <div class="row col-actions">
            <button id="restartBtn" class="danger small hidden" data-i18n="cit.backToLobby"></button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <!-- choosing a character -->
  <div id="pickModal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet pick-sheet">
      <div class="sheet-head"><h2 data-i18n="cit.pick.title"></h2><button id="pickClose" class="ghost small" data-i18n="cit.pick.later"></button></div>
      <div id="pickBody" class="sheet-body"></div>
    </div>
  </div>

  <!-- picking a target, a card, an amount -->
  <div id="chooser" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet chooser-sheet">
      <div class="sheet-head"><h2 id="chooserTitle"></h2><button id="chooserClose" class="ghost small" data-i18n="ui.close"></button></div>
      <div class="sheet-body">
        <p id="chooserHint" class="muted small-text chooser-hint"></p>
        <div id="chooserBody" class="chooser-body"></div>
        <div id="chooserFoot" class="row chooser-foot hidden"><button id="chooserOk" class="primary"></button></div>
      </div>
    </div>
  </div>

  <!-- one card up close, with what you can do with it -->
  <div id="cardModal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="card-zoom">
      <div id="cardZoom"></div>
      <div id="cardActions" class="card-actions"></div>
    </div>
  </div>

  <!-- results -->
  <div id="results" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet results-sheet">
      <div class="sheet-head"><h2 data-i18n="cit.results"></h2><button id="resultsClose" class="ghost small" data-i18n="ui.close"></button></div>
      <div id="resultsBody" class="sheet-body"></div>
    </div>
  </div>

  <!-- leaderboard -->
  <div id="boardSheet" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet board-sheet">
      <div class="sheet-head">
        <h2><span class="trophy"></span> <span data-i18n="cit.board.title"></span></h2>
        <button id="boardClose" class="ghost small" data-i18n="ui.close"></button>
      </div>
      <div class="sheet-body">
        <div class="tabs board-tabs" role="tablist">
          <button data-board="wins" data-i18n="cit.board.tab.wins"></button>
          <button data-board="winrate" data-i18n="cit.board.tab.winrate"></button>
          <button data-board="best" data-i18n="cit.board.tab.best"></button>
          <button data-board="avg" data-i18n="cit.board.tab.avg"></button>
          <button data-board="games" data-i18n="cit.board.tab.games"></button>
        </div>
        <ol id="boardList" class="board-list"></ol>
        <p id="boardNote" class="muted small-text"></p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/kingdoms/cit-i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/voice.js"></script>
  <script src="/kingdoms/art.js"></script>
  <script src="/kingdoms/cit.js"></script>
</body>
</html>
