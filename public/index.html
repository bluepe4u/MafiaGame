<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mafia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">MAFIA</div>
    <div id="topRoom" class="hidden"><span data-i18n="ui.room"></span> <span id="topCode" class="code"></span></div>
    <div id="topPhase" class="phase-title"></div>
    <div class="spacer"></div>
    <div id="topMe" class="muted"></div>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="leaveBtn" class="ghost small hidden" data-i18n="ui.leaveRoom"></button>
  </header>

  <main id="app">
    <section id="home" class="screen hidden">
      <div class="card home-card">
        <h1>Mafia</h1>
        <p class="muted" data-i18n="ui.tagline"></p>
        <label><span data-i18n="ui.yourName"></span> <input id="name" maxlength="20" autocomplete="nickname" autofocus></label>
        <button id="createBtn" class="primary" data-i18n="ui.createRoom"></button>
        <div class="divider"><span data-i18n="ui.orJoin"></span></div>
        <div class="row">
          <input id="joinCode" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters">
          <button id="joinBtn" data-i18n="ui.join"></button>
        </div>
      </div>
    </section>

    <section id="lobby" class="screen hidden">
      <div class="lobby-grid">
        <div class="card">
          <h2><span data-i18n="ui.players"></span> <span id="lobbyCount" class="muted small-text"></span></h2>
          <ul id="lobbyPlayers" class="list"></ul>
          <p id="shareCode" class="muted small-text"></p>
        </div>
        <div class="card">
          <h2 data-i18n="ui.gameSetup"></h2>
          <div id="hostSettings" class="hidden">
            <div class="grid4">
              <label><span data-i18n="role.mafia"></span> <input type="number" min="1" max="6" data-role="mafia"></label>
              <label><span data-i18n="role.cop"></span> <input type="number" min="0" max="1" data-role="cop"></label>
              <label><span data-i18n="role.doctor"></span> <input type="number" min="0" max="1" data-role="doctor"></label>
              <label><span data-i18n="role.hooker"></span> <input type="number" min="0" max="1" data-role="hooker"></label>
            </div>
            <button id="autoRoles" class="ghost small" data-i18n="ui.resetAuto"></button>
            <div class="grid2 settings-rest">
              <label><span data-i18n="ui.speechTime"></span> <input type="number" min="10" max="600" id="speechSeconds"></label>
              <div class="checks">
                <label class="check"><input type="checkbox" id="firstNightKill"> <span data-i18n="ui.firstNightKill"></span></label>
                <label class="check"><input type="checkbox" id="revealRole"> <span data-i18n="ui.revealRole"></span></label>
              </div>
            </div>
          </div>
          <ul id="setupSummary" class="summary"></ul>
          <p id="roleError" class="error"></p>
          <button id="startBtn" class="primary hidden" data-i18n="ui.startGame"></button>
          <p id="waitHost" class="muted hidden" data-i18n="ui.waitHost"></p>
        </div>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <div class="game-grid">
        <div class="table-wrap">
          <div id="table" class="table">
            <div class="felt"></div>
            <div id="phasePanel" class="center-panel"></div>
          </div>
        </div>
        <aside class="sidebar">
          <div class="card">
            <div class="bar">
              <h3 data-i18n="ui.yourRole"></h3>
              <button id="roleToggle" class="ghost small"></button>
            </div>
            <div id="roleCard"></div>
          </div>
          <div id="privateBox" class="card hidden"><h3 data-i18n="ui.privateNotes"></h3><ul id="privateLog" class="log"></ul></div>
          <div class="card grow"><h3 data-i18n="ui.townLog"></h3><ul id="log" class="log"></ul></div>
          <div id="hostPanel" class="card host-panel hidden">
            <h3 data-i18n="ui.hostControls"></h3>
            <p class="muted small-text" data-i18n="ui.hostHint"></p>
            <div id="hostButtons" class="row"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="row modal-actions">
        <button id="modalCancel" data-i18n="ui.cancel"></button>
        <button id="modalHold" class="danger hold"><span class="hold-fill"></span><span class="hold-label" data-i18n="ui.hold"></span></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
