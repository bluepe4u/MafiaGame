<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mafia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5484d'/%3E%3Cpath d='M7 19h18l-2.2-7.5c-.3-1-1.4-1.5-2.3-1l-2.2 1.1a3 3 0 0 1-2.6 0l-2.2-1.1c-.9-.5-2 0-2.3 1z' fill='%23fff'/%3E%3Crect x='4' y='19' width='24' height='2.6' rx='1.3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="home">
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-a"></div><div class="orb orb-b"></div>
    <div class="fog fog-a"></div><div class="fog fog-b"></div>
    <div id="bats" class="bats"></div>
    <div class="grain"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M7 19h18l-2.2-7.5c-.3-1-1.4-1.5-2.3-1l-2.2 1.1a3 3 0 0 1-2.6 0l-2.2-1.1c-.9-.5-2 0-2.3 1z"/><rect x="4" y="19" width="24" height="2.6" rx="1.3"/></svg>
      <span>Mafia</span>
    </div>
    <button id="topRoom" class="room-pill hidden" type="button"><span data-i18n="ui.room"></span> <span id="topCode" class="code"></span></button>
    <div id="topPhase" class="phase-chip"></div>
    <div id="topWatchers" class="watchers-chip hidden"></div>
    <div class="spacer"></div>
    <div id="topMe" class="muted top-me"></div>
    <button id="spookyBtn" class="icon-btn spooky-btn" type="button" aria-pressed="false"></button>
    <button id="alertsBtn" class="icon-btn" type="button" aria-pressed="true"></button>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="leaveBtn" class="ghost small hidden" data-i18n="ui.leaveRoom"></button>
    <button id="profileBtn" class="profile-btn hidden" type="button"></button>
  </header>

  <div id="offline" class="offline-banner hidden" role="status"><span class="spinner"></span><span data-i18n="ui.reconnecting"></span></div>

  <main id="app">
    <section id="home" class="screen hidden">
      <div class="hero">
        <p class="eyebrow" data-i18n="ui.eyebrow"></p>
        <h1><span data-i18n="ui.heroA"></span> <em data-i18n="ui.heroB"></em></h1>
        <p class="muted hero-sub" data-i18n="ui.tagline"></p>
      </div>
      <form id="authCard" class="card home-card hidden" autocomplete="on">
        <div class="tabs auth-tabs" role="tablist">
          <button type="button" data-auth-mode="login" data-i18n="auth.login"></button>
          <button type="button" data-auth-mode="register" data-i18n="auth.register"></button>
        </div>
        <label class="field"><span data-i18n="auth.username"></span> <input id="authUser" name="username" maxlength="20" autocomplete="username" spellcheck="false"></label>
        <label class="field"><span data-i18n="auth.password"></span> <input id="authPass" name="password" type="password" autocomplete="current-password"></label>
        <button id="authSubmit" type="submit" class="primary big-btn"></button>
        <p class="muted small-text auth-hint" data-i18n="auth.hint"></p>
      </form>
      <div id="playCard" class="card home-card hidden">
        <button id="homeProfile" class="me-row" type="button"></button>
        <button id="createBtn" class="primary big-btn" data-i18n="ui.createRoom"></button>
        <div class="divider"><span data-i18n="ui.orJoin"></span></div>
        <div class="row join-row">
          <input id="joinCode" class="code-input" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters" spellcheck="false">
          <button id="joinBtn" data-i18n="ui.join"></button>
          <button id="watchBtn" class="ghost" data-i18n="ui.watch"></button>
        </div>
      </div>
    </section>

    <section id="lobby" class="screen hidden">
      <div class="lobby-grid">
        <div class="lobby-col">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="ui.players"></h2>
            <span id="lobbyCount" class="count-pill"></span>
          </div>
          <ul id="lobbyPlayers" class="list"></ul>
          <div class="row lobby-me">
            <button id="readyBtn" class="ready-btn"></button>
            <button id="watchToggle" class="ghost small"></button>
            <span id="readyCount" class="count-pill"></span>
          </div>
          <div id="spectatorBox" class="spectator-box hidden">
            <h3 data-i18n="ui.spectators"></h3>
            <div id="spectatorList" class="spectator-list"></div>
          </div>
          <div id="lobbyReactSlot" class="react-slot"></div>
          <div class="invite">
            <img id="inviteQr" class="qr" alt="" width="104" height="104">
            <div class="invite-body">
              <p id="shareCode" class="share muted"></p>
              <p class="muted small-text" data-i18n="ui.scanToJoin"></p>
              <div class="row">
                <button id="copyLink" class="small" data-i18n="ui.copyLink"></button>
                <button id="shareLink" class="small ghost hidden" data-i18n="ui.share"></button>
              </div>
            </div>
          </div>
        </div>
        <div class="card lobby-chat">
          <div class="card-head"><h2 data-i18n="tab.chat"></h2></div>
          <div id="lobbyChatSlot" class="chat-slot"></div>
        </div>
        </div>
        <div class="card">
          <div class="card-head"><h2 data-i18n="ui.gameSetup"></h2></div>
          <div id="hostSettings" class="hidden">
            <div class="grid4">
              <label class="field role-field" data-team="mafia"><span data-i18n="role.mafia"></span> <input type="number" min="1" max="6" data-role="mafia"></label>
              <label class="field role-field"><span data-i18n="role.cop"></span> <input type="number" min="0" max="1" data-role="cop"></label>
              <label class="field role-field"><span data-i18n="role.doctor"></span> <input type="number" min="0" max="1" data-role="doctor"></label>
              <label class="field role-field"><span data-i18n="role.hooker"></span> <input type="number" min="0" max="1" data-role="hooker"></label>
            </div>
            <button id="autoRoles" class="ghost small" data-i18n="ui.resetAuto"></button>
            <div class="grid2 settings-rest">
              <div class="checks">
                <label class="field"><span data-i18n="ui.speechTime"></span> <input type="number" min="10" max="600" id="speechSeconds"></label>
                <label class="field"><span data-i18n="ui.voteTime"></span> <input type="number" min="0" max="900" step="10" id="voteSeconds"></label>
                <label class="field"><span data-i18n="ui.nightTime"></span> <input type="number" min="0" max="900" step="10" id="nightSeconds"></label>
              </div>
              <div class="checks">
                <label class="check"><input type="checkbox" class="switch" id="firstNightKill"> <span data-i18n="ui.firstNightKill"></span></label>
                <label class="check"><input type="checkbox" class="switch" id="revealRole"> <span data-i18n="ui.revealRole"></span></label>
              </div>
            </div>
          </div>
          <ul id="setupSummary" class="summary"></ul>
          <p id="roleError" class="error"></p>
          <button id="startBtn" class="primary big-btn hidden" data-i18n="ui.startGame"></button>
          <p id="waitHost" class="wait muted hidden"><span class="dots"><i></i><i></i><i></i></span> <span data-i18n="ui.waitHost"></span></p>
        </div>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <div class="game-grid">
        <div class="table-wrap">
          <div id="table" class="table">
            <div class="felt"><div class="felt-inner"></div></div>
            <div id="phasePanel" class="center-panel"></div>
          </div>
          <div id="gameReactSlot" class="react-slot game-react"></div>
        </div>
        <aside class="sidebar">
          <div class="card role-box">
            <h3 data-i18n="ui.yourRole"></h3>
            <div id="roleCard" class="role-card" tabindex="0"></div>
          </div>
          <div id="privateBox" class="card hidden"><h3 data-i18n="ui.privateNotes"></h3><ul id="privateLog" class="log"></ul></div>
          <div class="card grow tabs-card">
            <div class="tabs" role="tablist">
              <button role="tab" data-tab="chat"><span data-i18n="tab.chat"></span><span id="chatBadge" class="badge hidden"></span></button>
              <button role="tab" data-tab="log" data-i18n="tab.log"></button>
              <button role="tab" data-tab="votes" data-i18n="tab.votes"></button>
              <button role="tab" data-tab="notes" data-i18n="tab.notes"></button>
            </div>
            <div class="tab-panel" data-panel="chat"><div id="gameChatSlot" class="chat-slot"></div></div>
            <div class="tab-panel" data-panel="log"><ul id="log" class="log"></ul></div>
            <div class="tab-panel" data-panel="votes"><div id="votesPanel" class="votes-panel"></div></div>
            <div class="tab-panel" data-panel="notes">
              <textarea id="notePad" class="note-pad" data-i18n-placeholder="notes.placeholder"></textarea>
              <p class="muted small-text notes-hint" data-i18n="notes.hint"></p>
            </div>
          </div>
          <div id="hostPanel" class="card host-panel hidden">
            <h3 data-i18n="ui.hostControls"></h3>
            <p class="muted small-text" data-i18n="ui.hostHint"></p>
            <div id="hostButtons" class="row"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="row modal-actions">
        <button id="modalCancel" data-i18n="ui.cancel"></button>
        <button id="modalHold" class="danger hold"><span class="hold-fill"></span><span class="hold-label" data-i18n="ui.hold"></span></button>
      </div>
    </div>
  </div>
  <div id="reveal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="reveal-stage">
      <button id="revealCard" class="flip-card" type="button">
        <span class="flip-face flip-back">
          <svg class="flip-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 19h18l-2.2-7.5c-.3-1-1.4-1.5-2.3-1l-2.2 1.1a3 3 0 0 1-2.6 0l-2.2-1.1c-.9-.5-2 0-2.3 1z"/><rect x="4" y="19" width="24" height="2.6" rx="1.3"/></svg>
          <span class="flip-tap" data-i18n="reveal.tap"></span>
          <span class="muted small-text" data-i18n="reveal.private"></span>
        </span>
        <span id="revealFront" class="flip-face flip-front"></span>
      </button>
      <button id="revealDone" class="primary big-btn hidden" data-i18n="reveal.done"></button>
    </div>
  </div>

  <div id="recap" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 data-i18n="recap.title"></h2>
        <button id="recapClose" class="ghost small" data-i18n="ui.close"></button>
      </div>
      <div id="recapBody" class="sheet-body"></div>
    </div>
  </div>

  <div id="profile" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet profile-sheet">
      <div class="sheet-head">
        <h2 data-i18n="profile.title"></h2>
        <button id="profileClose" class="ghost small" data-i18n="ui.close"></button>
      </div>
      <div class="sheet-body">
        <div class="profile-top">
          <label class="avatar-upload">
            <span id="profileAvatar"></span>
            <span class="avatar-edit" data-i18n="profile.changePhoto"></span>
            <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/heic,image/*" hidden>
          </label>
          <div class="profile-id">
            <div id="profileName" class="profile-name"></div>
            <div id="profileStatus"></div>
            <div class="karma">
              <span class="karma-up" id="profileLikes"></span>
              <span class="karma-down" id="profileDislikes"></span>
            </div>
          </div>
        </div>
        <div>
          <h3 data-i18n="profile.stats"></h3>
          <div id="profileStats" class="stats"></div>
        </div>
        <div id="wardrobeBox">
          <h3 data-i18n="wardrobe.title"></h3>
          <div id="wardrobe" class="wardrobe"></div>
        </div>
        <p class="muted small-text" data-i18n="profile.decencyHint"></p>
        <div id="tierLadder" class="tier-ladder"></div>
        <form id="passwordForm" class="password-form" autocomplete="on">
          <h3 data-i18n="profile.changePassword"></h3>
          <input type="text" name="username" autocomplete="username" hidden>
          <div class="row">
            <input id="oldPass" type="password" autocomplete="current-password" data-i18n-placeholder="profile.oldPassword">
            <input id="newPass" type="password" autocomplete="new-password" data-i18n-placeholder="profile.newPassword">
            <button type="submit" data-i18n="profile.save"></button>
          </div>
        </form>
        <div class="row">
          <button id="logoutBtn" class="danger" data-i18n="profile.logout"></button>
          <button id="adminBtn" class="ghost hidden" data-i18n="admin.open"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="admin" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="sheet admin-sheet">
      <div class="sheet-head">
        <h2 data-i18n="admin.title"></h2>
        <button id="adminClose" class="ghost small" data-i18n="ui.close"></button>
      </div>
      <div id="adminBody" class="sheet-body admin-body"></div>
    </div>
  </div>

  <div id="giftBox" class="overlay gift-overlay hidden" role="dialog" aria-modal="true">
    <div class="gift-stage">
      <div class="gift-title" data-i18n="gift.title"></div>
      <button id="giftPresent" class="gift-present" type="button" aria-label="Open">🎁</button>
      <div id="giftItem" class="gift-item hidden"></div>
      <div id="giftName" class="gift-name"></div>
      <button id="giftDone" class="primary hidden" data-i18n="gift.done"></button>
    </div>
  </div>

  <div id="markMenu" class="mark-menu hidden" role="dialog">
    <div id="markTitle" class="mark-title"></div>
    <div class="mark-options">
      <button data-set-mark="black" class="mk black"><i></i><span data-i18n="mark.black"></span></button>
      <button data-set-mark="red" class="mk red"><i></i><span data-i18n="mark.red"></span></button>
      <button data-set-mark="unsure" class="mk unsure"><i></i><span data-i18n="mark.unsure"></span></button>
      <button data-set-mark="" class="mk clear"><i></i><span data-i18n="mark.clear"></span></button>
    </div>
    <input id="markNote" maxlength="40" data-i18n-placeholder="mark.note">
  </div>

  <template id="chatTemplate">
    <div id="chat" class="chat">
      <div id="chatChannels" class="chat-channels hidden">
        <button data-channel="town"><span data-i18n="chat.town"></span><span class="badge hidden"></span></button>
        <button data-channel="mafia"><span data-i18n="chat.mafia"></span><span class="badge hidden"></span></button>
        <button data-channel="dead"><span data-i18n="chat.dead"></span><span class="badge hidden"></span></button>
      </div>
      <div id="chatList" class="chat-list" aria-live="polite"></div>
      <button id="revealBtn" class="reveal-btn hidden" type="button" data-i18n="chat.reveal"></button>
      <p id="chatClosed" class="chat-closed hidden"></p>
      <form id="chatForm" class="chat-form" autocomplete="off">
        <input id="chatInput" maxlength="300" data-i18n-placeholder="chat.placeholder">
        <button id="chatSend" class="primary" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
      </form>
    </div>
  </template>

  <div id="reactBar" class="react-bar hidden"></div>

  <div id="countdown" class="countdown hidden" role="alertdialog">
    <div class="countdown-inner">
      <div class="countdown-title" data-i18n="countdown.title"></div>
      <div id="countdownNum" class="countdown-num"></div>
      <button id="countdownCancel" class="countdown-cancel" data-i18n="countdown.cancel"></button>
    </div>
  </div>

  <div id="phaseCard" class="phase-card hidden" aria-hidden="true">
    <div class="phase-card-inner">
      <div id="phaseCardIcon" class="phase-card-icon"></div>
      <div id="phaseCardTitle" class="phase-card-title"></div>
      <div id="phaseCardSub" class="phase-card-sub"></div>
    </div>
  </div>
  <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
