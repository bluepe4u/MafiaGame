<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>bluepeau</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Cpath d='M9 22V10h7a4 4 0 0 1 0 8H9' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="hub" data-phase="home">
  <div class="backdrop" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grain"></div></div>

  <header class="topbar">
    <div class="brand-switch">
      <button id="brandBtn" class="brand" type="button" aria-haspopup="true">
        <svg class="brand-mark hub-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M9 22V10h7a4 4 0 0 1 0 8H9"/></svg>
        <span>bluepeau</span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <nav id="siteMenu" class="site-menu hidden">
        <a href="/" class="current"><span class="site-ico"></span><span data-i18n="site.hub"></span></a>
        <a href="/mafia/"><span class="site-ico"></span><span data-i18n="site.mafia"></span></a>
        <a href="/monopoly/"><span class="site-ico"></span><span data-i18n="site.monopoly"></span></a>
      </nav>
    </div>
    <div class="spacer"></div>
    <button id="boardBtn" class="icon-btn hidden" type="button"></button>
    <button id="alertsBtn" class="icon-btn" type="button" aria-pressed="true"></button>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="profileBtn" class="profile-btn hidden" type="button"></button>
  </header>

  <main id="app">
    <section id="home" class="screen hub-home">
      <div class="hero hub-hero">
        <p class="eyebrow" data-i18n="hub.eyebrow"></p>
        <h1><span data-i18n="hub.heroA"></span> <em data-i18n="hub.heroB"></em></h1>
        <p class="muted hero-sub" data-i18n="hub.tagline"></p>
      </div>
      <div id="bootLoader" class="boot-loader" role="status"><span class="spinner"></span></div>

      <form id="authCard" class="card home-card hidden" autocomplete="on">
        <div class="tabs auth-tabs" role="tablist">
          <button type="button" data-auth-mode="login" data-i18n="auth.login"></button>
          <button type="button" data-auth-mode="register" data-i18n="auth.register"></button>
        </div>
        <label class="field"><span data-i18n="auth.username"></span> <input id="authUser" name="username" maxlength="20" autocomplete="username" spellcheck="false"></label>
        <label class="field"><span data-i18n="auth.password"></span> <input id="authPass" name="password" type="password" autocomplete="current-password"></label>
        <label id="inviteField" class="field hidden"><span data-i18n="auth.invite"></span> <input id="authInvite" name="invite" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <button id="authSubmit" type="submit" class="primary big-btn"></button>
        <p class="muted small-text auth-hint" data-i18n="auth.hint"></p>
      </form>

      <div id="hubMain" class="hub-grid hidden">
        <div class="hub-col">
          <div id="playCard" class="card home-card hub-card">
            <button id="homeProfile" class="me-row" type="button"></button>
            <form id="hubJoin" class="hub-join">
              <span class="muted small-text" data-i18n="hub.joinTitle"></span>
              <div class="row join-row">
                <input id="joinCode" class="code-input" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters" spellcheck="false">
                <button id="joinBtn" type="submit" data-i18n="ui.join"></button>
                <button id="watchBtn" type="button" class="ghost" data-i18n="ui.watch"></button>
              </div>
            </form>
          </div>
        </div>
        <div class="hub-col">
          <h2 class="hub-h" data-i18n="hub.games"></h2>
          <div id="gameCards" class="game-cards"></div>
          <div class="hub-links">
            <button id="hubBoard" class="ghost" type="button"><span class="trophy"></span> <span data-i18n="lb.title"></span></button>
            <button id="hubArchive" class="ghost" type="button"><span data-i18n="archive.mine"></span></button>
            <button id="hubRules" class="ghost" type="button"><span data-i18n="rules.title"></span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/hub.js"></script>
</body>
</html>
