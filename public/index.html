<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Mafia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e5484d'/%3E%3Cpath d='M7 19h18l-2.2-7.5c-.3-1-1.4-1.5-2.3-1l-2.2 1.1a3 3 0 0 1-2.6 0l-2.2-1.1c-.9-.5-2 0-2.3 1z' fill='%23fff'/%3E%3Crect x='4' y='19' width='24' height='2.6' rx='1.3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-phase="home">
  <div class="backdrop" aria-hidden="true"><div class="orb orb-a"></div><div class="orb orb-b"></div><div class="grain"></div></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M7 19h18l-2.2-7.5c-.3-1-1.4-1.5-2.3-1l-2.2 1.1a3 3 0 0 1-2.6 0l-2.2-1.1c-.9-.5-2 0-2.3 1z"/><rect x="4" y="19" width="24" height="2.6" rx="1.3"/></svg>
      <span>Mafia</span>
    </div>
    <button id="topRoom" class="room-pill hidden" type="button"><span data-i18n="ui.room"></span> <span id="topCode" class="code"></span></button>
    <div id="topPhase" class="phase-chip"></div>
    <div class="spacer"></div>
    <div id="topMe" class="muted top-me"></div>
    <select id="langSelect" class="lang-select" aria-label="Language"></select>
    <button id="leaveBtn" class="ghost small hidden" data-i18n="ui.leaveRoom"></button>
  </header>

  <main id="app">
    <section id="home" class="screen hidden">
      <div class="hero">
        <p class="eyebrow" data-i18n="ui.eyebrow"></p>
        <h1><span data-i18n="ui.heroA"></span> <em data-i18n="ui.heroB"></em></h1>
        <p class="muted hero-sub" data-i18n="ui.tagline"></p>
      </div>
      <div class="card home-card">
        <label class="field"><span data-i18n="ui.yourName"></span> <input id="name" maxlength="20" autocomplete="nickname" autofocus></label>
        <button id="createBtn" class="primary big-btn" data-i18n="ui.createRoom"></button>
        <div class="divider"><span data-i18n="ui.orJoin"></span></div>
        <div class="row join-row">
          <input id="joinCode" class="code-input" data-i18n-placeholder="ui.roomCode" maxlength="4" autocapitalize="characters" spellcheck="false">
          <button id="joinBtn" data-i18n="ui.join"></button>
        </div>
      </div>
    </section>

    <section id="lobby" class="screen hidden">
      <div class="lobby-grid">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="ui.players"></h2>
            <span id="lobbyCount" class="count-pill"></span>
          </div>
          <ul id="lobbyPlayers" class="list"></ul>
          <p id="shareCode" class="share muted"></p>
        </div>
        <div class="card">
          <div class="card-head"><h2 data-i18n="ui.gameSetup"></h2></div>
          <div id="hostSettings" class="hidden">
            <div class="grid4">
              <label class="field role-field" data-team="mafia"><span data-i18n="role.mafia"></span> <input type="number" min="1" max="6" data-role="mafia"></label>
              <label class="field role-field"><span data-i18n="role.cop"></span> <input type="number" min="0" max="1" data-role="cop"></label>
              <label class="field role-field"><span data-i18n="role.doctor"></span> <input type="number" min="0" max="1" data-role="doctor"></label>
              <label class="field role-field"><span data-i18n="role.hooker"></span> <input type="number" min="0" max="1" data-role="hooker"></label>
            </div>
            <button id="autoRoles" class="ghost small" data-i18n="ui.resetAuto"></button>
            <div class="grid2 settings-rest">
              <label class="field"><span data-i18n="ui.speechTime"></span> <input type="number" min="10" max="600" id="speechSeconds"></label>
              <div class="checks">
                <label class="check"><input type="checkbox" class="switch" id="firstNightKill"> <span data-i18n="ui.firstNightKill"></span></label>
                <label class="check"><input type="checkbox" class="switch" id="revealRole"> <span data-i18n="ui.revealRole"></span></label>
              </div>
            </div>
          </div>
          <ul id="setupSummary" class="summary"></ul>
          <p id="roleError" class="error"></p>
          <button id="startBtn" class="primary big-btn hidden" data-i18n="ui.startGame"></button>
          <p id="waitHost" class="wait muted hidden"><span class="dots"><i></i><i></i><i></i></span> <span data-i18n="ui.waitHost"></span></p>
        </div>
      </div>
    </section>

    <section id="game" class="screen hidden">
      <div class="game-grid">
        <div class="table-wrap">
          <div id="table" class="table">
            <div class="felt"><div class="felt-inner"></div></div>
            <div id="phasePanel" class="center-panel"></div>
          </div>
        </div>
        <aside class="sidebar">
          <div class="card role-box">
            <div class="bar">
              <h3 data-i18n="ui.yourRole"></h3>
              <button id="roleToggle" class="ghost small"></button>
            </div>
            <div id="roleCard"></div>
          </div>
          <div id="privateBox" class="card hidden"><h3 data-i18n="ui.privateNotes"></h3><ul id="privateLog" class="log"></ul></div>
          <div class="card grow"><h3 data-i18n="ui.townLog"></h3><ul id="log" class="log"></ul></div>
          <div id="hostPanel" class="card host-panel hidden">
            <h3 data-i18n="ui.hostControls"></h3>
            <p class="muted small-text" data-i18n="ui.hostHint"></p>
            <div id="hostButtons" class="row"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="row modal-actions">
        <button id="modalCancel" data-i18n="ui.cancel"></button>
        <button id="modalHold" class="danger hold"><span class="hold-fill"></span><span class="hold-label" data-i18n="ui.hold"></span></button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
